<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0B0C" />
    <title>Offline — The Ledger</title>
    <!--
      Served by the service worker when a page navigation fails because there is no
      connection. It must be fully self-contained: no stylesheet, no web font, no
      script bundle, because none of those can be fetched either.
    -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #08080a;
        color: #f4f4f6;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        min-height: 100%;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px 24px calc(24px + env(safe-area-inset-bottom));
      }
      svg {
        width: 44px;
        height: auto;
        margin-bottom: 28px;
      }
      h1 {
        font-size: 19px;
        font-weight: 600;
        letter-spacing: -0.01em;
        margin: 0;
      }
      p {
        margin: 8px 0 0;
        max-width: 300px;
        font-size: 14px;
        line-height: 1.55;
        color: #a6a6b5;
      }
      button {
        margin-top: 24px;
        border: 0;
        border-radius: 12px;
        padding: 11px 22px;
        font: inherit;
        font-size: 14px;
        font-weight: 600;
        background: #f5f5f6;
        color: #0b0b0c;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 22 18" aria-hidden="true">
        <rect x="0" y="9" width="5" height="9" rx="1.5" fill="#F5F5F6" />
        <rect x="8.5" y="4.5" width="5" height="13.5" rx="1.5" fill="#F5F5F6" />
        <rect x="17" y="0" width="5" height="18" rx="1.5" fill="#FBBF24" />
      </svg>
      <h1>You're offline</h1>
      <p>The Ledger needs a connection to load. We'll reload as soon as you're back online.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
    <script>
      // Reload by itself once the connection returns, so nobody has to notice.
      window.addEventListener("online", function () {
        location.reload();
      });
    </script>
  </body>
</html>
